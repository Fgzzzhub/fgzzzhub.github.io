<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login E-Learning SKANU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand:'#01665E' } /* warna utama login mengikuti desain webmu */
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style> body{font-family:'Poppins',sans-serif} </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <main class="max-w-6xl mx-auto px-4 md:px-6 py-10 md:py-14">
    <h1 class="text-2xl md:text-3xl font-bold text-brand">Login E-Learning Skanu</h1>

    <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 items-start">
      <!-- Ilustrasi -->
      <div class="order-2 md:order-1">
        <div class="rounded-3xl p-6 md:p-8
                     relative overflow-hidden">
          <img src="../assets/component/Group 2343.png" alt="Ilustrasi siswi menyapa"
               class="w-full max-w-md md:max-w-none mx-auto drop-shadow-xl select-none pointer-events-none" />
        </div>
      </div>

      <!-- Form -->
      <section class="order-1 md:order-2">
        <h2 class="text-3xl font-bold text-slate-900">Login</h2>
        <p class="text-slate-600 mt-1">Silahkan login menggunakan akun yang telah diberikan</p>

        <form class="mt-6 space-y-4" action="../e-learning/index.html" method="get">
          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-semibold text-slate-700">Email</label>
            <input id="email" name="email" type="email" required
                   class="mt-1 w-full rounded-xl border border-brand/40 focus:border-brand focus:ring-2 focus:ring-brand/20 px-4 py-3 outline-none bg-white" />
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
            <div class="relative mt-1">
              <input id="password" name="password" type="password" required
                     class="w-full rounded-xl border border-brand/40 focus:border-brand focus:ring-2 focus:ring-brand/20 px-4 py-3 pr-10 outline-none bg-white" />
              <button type="button" id="togglePass"
                      class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-slate-500 hover:text-brand"
                      aria-label="Tampilkan password">
                <svg id="eye" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Tombol Login -->
          <button class="w-full rounded-xl bg-brand text-white font-semibold py-3 hover:opacity-90">Login</button>

          <!-- Lupa password -->
          <div class="text-sm">
            <a href="#" class="text-brand hover:underline">Lupa Password?</a>
          </div>

          <!-- Divider -->
          <div class="flex items-center gap-3 pt-2">
            <span class="h-px flex-1 bg-slate-300"></span>
            <span class="text-slate-500 text-sm font-semibold">Or</span>
            <span class="h-px flex-1 bg-slate-300"></span>
          </div>

          <!-- Sosial -->
          <button type="button"
                  class="w-full flex items-center justify-center gap-3 rounded-xl border-2 border-slate-300 bg-slate-50 hover:bg-white py-2.5">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="#1877F2"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06a10 10 0 0 0 8.44 9.86v-6.98H7.9v-2.88h2.54V9.41c0-2.5 1.5-3.88 3.79-3.88 1.1 0 2.25.2 2.25.2v2.47h-1.27c-1.25 0-1.64.78-1.64 1.58v1.9h2.8l-.45 2.88h-2.35v6.98A10 10 0 0 0 22 12.06z"/></svg>
            <span>Login dengan Facebook</span>
          </button>

          <button type="button"
                  class="w-full flex items-center justify-center gap-3 rounded-xl border-2 border-slate-300 bg-slate-50 hover:bg-white py-2.5">
            <svg class="h-5 w-5" viewBox="0 0 533.5 544.3"><path fill="#EA4335" d="M533.5 278.4c0-17.4-1.6-34-4.7-50.1H272.1v94.8h147.1c-6.3 34-25 62.8-53.3 82v67h86.1c50.4-46.5 81.5-114.9 81.5-193.7z"/><path fill="#34A853" d="M272.1 544.3c72.7 0 133.7-24 178.2-65.2l-86.1-67c-23.9 16.1-54.6 25.6-92.1 25.6-70.8 0-130.8-47.8-152.3-111.9H31v70.2c44.2 87.6 135.6 148.3 241.1 148.3z"/><path fill="#4A90E2" d="M119.8 326.1c-10.3-30.6-10.3-63.8 0-94.4V161.5H31c-44.2 87.6-44.2 192.9 0 280.5l88.8-66z"/><path fill="#FBBC05" d="M272.1 107.7c39.6-.6 77.4 14.5 106.3 42.1l79.2-79.2C408.5 24.2 343.1-.1 272.1 0 166.6 0 75.2 60.7 31 148.3l88.8 70.2c21.5-64.1 81.5-110.8 152.3-110.8z"/></svg>
            <span>Login dengan Google</span>
          </button>

          <p class="text-sm text-slate-600 pt-2">
            Belum punya akun? <a href="register.html" class="text-brand font-semibold hover:underline">Daftar SPMB SKANU</a>
          </p>
        </form>
      </section>
    </div>
  </main>

  <script>
    // show/hide password
    const pass = document.getElementById('password');
    document.getElementById('togglePass').addEventListener('click', ()=>{
      pass.type = pass.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
